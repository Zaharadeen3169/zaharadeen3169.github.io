<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pan Tech Africa</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#fff;--card:#fff;--tx:#111827;--mu:#6B7280;--pr:#102A43;--hd:#102A43;--btn:#102A43;--btx:#fff;--ac:#00C2A8;--bd:#D5DAE0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0E1116;--card:#151A21;--tx:#F3F4F6;--mu:#9CA3AF;--pr:#E5E7EB;--hd:#102A43;--btn:#F3F4F6;--btx:#111827;--bd:#2A323C}}
:root[data-theme=dark]{--bg:#0E1116;--card:#151A21;--tx:#F3F4F6;--mu:#9CA3AF;--pr:#E5E7EB;--hd:#102A43;--btn:#F3F4F6;--btx:#111827;--bd:#2A323C}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}main{overflow-x:hidden}img{max-width:100%}.card{min-width:0;overflow-wrap:anywhere}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:72px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;padding:10px 14px 12px;z-index:5}
.top{display:flex;align-items:center;gap:10px}.logo{flex:1;font-weight:800;font-size:18px;line-height:1.1}.logo b{color:var(--ac)}.logo small{display:block;font-size:10px;font-weight:400;opacity:.85;margin-top:2px}.hicon{position:relative;font-size:22px;cursor:pointer}#hb{position:absolute;top:-6px;right:-9px;background:var(--ac);color:#102A43;border-radius:99px;font-size:11px;padding:1px 6px}
header input{display:block;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:0;font-size:15px}
main{max-width:980px;margin:auto;padding:14px}h2{margin:18px 0 8px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:12px}
.img{height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:48px;background:rgba(127,127,127,.12)}
.pi{color:var(--tx);font-weight:800}.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:var(--btn);color:var(--btx);cursor:pointer;min-height:44px}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.sm{padding:6px 10px;min-height:36px;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
.in{color:#1a8a4a}.low{color:#c77700}.out{color:#c0392b}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.cats{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.cat{min-width:76px;text-align:center;font-size:11px;cursor:pointer}.cic{display:flex;width:58px;height:58px;border-radius:50%;background:rgba(127,127,127,.14);align-items:center;justify-content:center;font-size:26px;margin:0 auto 4px}.newb{position:absolute;top:6px;left:6px;background:var(--ac);color:#102A43;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}.va{font-size:13px;font-weight:600;color:var(--pr);cursor:pointer}.img{position:relative}
select,input.f,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:3px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}td,th{border:1px solid var(--bd);padding:6px;font-size:13px;text-align:left}.diff{background:rgba(127,127,127,.18)}
.step{padding:6px 0 6px 18px;border-left:3px solid var(--bd);margin-left:6px}.step.done{border-color:var(--pr)}
.modal{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;display:none}
.note{background:rgba(127,127,127,.1);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
footer{padding:20px 14px;text-align:center;color:var(--mu);font-size:12px}footer a{display:inline-block;margin:4px 8px;cursor:pointer;text-decoration:underline}
.wa{position:fixed;right:12px;bottom:84px;background:#25D366;color:#fff;padding:12px 16px;border-radius:99px;font-weight:700;text-decoration:none;z-index:7;box-shadow:0 2px 8px #0004}
.go{background:var(--btn);color:var(--btx);font-weight:700}
.go:disabled{opacity:.5;cursor:not-allowed}
</style></head><body>
