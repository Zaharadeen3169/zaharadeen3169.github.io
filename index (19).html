<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pan Tech Africa</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#1d1a16;--mu:#6b645a;--pr:#0f6b4f;--ac:#e8a317;--bd:#e7dfd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14120f;--card:#1f1c17;--tx:#f3ede2;--mu:#a39b8d;--pr:#35b88a;--bd:#38322a}}
:root[data-theme=dark]{--bg:#14120f;--card:#1f1c17;--tx:#f3ede2;--mu:#a39b8d;--pr:#35b88a;--bd:#38322a}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}main{overflow-x:hidden}img{max-width:100%}.card{min-width:0;overflow-wrap:anywhere}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:72px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:5}
.logo{font-weight:800;letter-spacing:.5px;font-size:15px;line-height:1}.logo b{color:var(--ac)}
header input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:0;font-size:15px}
main{max-width:980px;margin:auto;padding:14px}h2{margin:18px 0 8px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px}
.img{height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#f6e3b4,#cfe8dc)}
.pi{color:var(--pr);font-weight:800}.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer;min-height:44px}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}button.sm{padding:6px 10px;min-height:36px;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
.in{color:#1a8a4a}.low{color:#c77700}.out{color:#c0392b}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mu);cursor:pointer}nav a.on{color:var(--pr);font-weight:700}nav span{display:block;font-size:20px}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cats .card{text-align:center;cursor:pointer;font-size:13px}.cats i{font-style:normal;font-size:28px;display:block}
select,input.f,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:3px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}td,th{border:1px solid var(--bd);padding:6px;font-size:13px;text-align:left}.diff{background:#e8a31733}
.step{padding:6px 0 6px 18px;border-left:3px solid var(--bd);margin-left:6px}.step.done{border-color:var(--pr)}
.modal{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:var(--bg);width:100%;max-width:600px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;display:none}
.note{background:#e8a31722;border:1px solid var(--ac);border-radius:10px;padding:10px;font-size:13px;margin:10px 0}
footer{padding:20px 14px;text-align:center;color:var(--mu);font-size:12px}footer a{display:inline-block;margin:4px 8px;cursor:pointer;text-decoration:underline}
.wa{position:fixed;right:12px;bottom:84px;background:#25D366;color:#fff;padding:12px 16px;border-radius:99px;font-weight:700;text-decoration:none;z-index:7;box-shadow:0 2px 8px #0004}
</style></head><body>
<header><div class="logo" onclick="go('home')">PAN<br>TECH <b>AFRICA</b></div><input id="q" placeholder="Search smartphones, laptops, gadgets..." oninput="search(this.value)"><span onclick="go('notifications')" style="font-size:22px;position:relative">🔔<b id="nb" style="display:none;position:absolute;top:-4px;right:-6px;background:#c0392b;color:#fff;border-radius:99px;font-size:11px;padding:1px 5px"></b></span></header>
<main id="app"></main><div id="toast"></div>
<nav><a data-p="home" onclick="go('home')"><span>🏠</span>Home</a><a data-p="shop" onclick="go('shop')"><span>🗂️</span>Categories</a><a data-p="compare" onclick="go('compare')"><span>⚖️</span>Compare</a><a data-p="cart" onclick="go('cart')"><span>🛒</span>Cart<b id="cc"></b></a><a data-p="profile" onclick="go('profile')"><span>👤</span>Profile</a></nav>
<script>
let LIVE=false,H=null,PAYOPEN=false,shipFee=0,COUNTRIES=[];
const CATS=[["Smartphones","📱"],["Laptops","💻"],["Tablets","📟"],["Smartwatches","⌚"],["Headphones & Earbuds","🎧"],["Chargers","🔌"],["Power Banks","🔋"],["Computer Accessories","⌨️"],["Other Technology","🧩"]];
// [id,name,brand,cat,pi,stock,rating,flags(f=featured,p=popular,n=new,o=offer),ram,storage,cpu,battery,extra]
let P0=[[1,"Galaxy A55","Samsung",0,95,12,4.5,"fp",8,128,"Exynos 1480","5000mAh","6.6in AMOLED, 50MP, Android 14"],[2,"Redmi Note 13","Xiaomi",0,60,3,4.3,"po",6,128,"Snapdragon 685","5000mAh","6.67in AMOLED, 108MP"],[3,"Tecno Camon 30","Tecno",0,52,20,4.1,"n",8,256,"Helio G99","5000mAh","6.78in, 50MP, Android 14"],[4,"iPhone 14","Apple",0,210,5,4.8,"fp",6,128,"A15 Bionic","3279mAh","6.1in OLED, iOS"],[5,"ThinkPad E14","Lenovo",1,230,6,4.4,"fp",16,512,"Core i5-1335U","57Wh","14in FHD, Windows 11"],[6,"HP 255 G9","HP",1,150,0,4.0,"o",8,256,"Ryzen 5 5625U","41Wh","15.6in, Windows 11"],[7,"MacBook Air M2","Apple",1,390,4,4.9,"pn",8,256,"Apple M2","52Wh","13.6in Retina, macOS"],[8,"Galaxy Tab A9","Samsung",2,58,9,4.2,"n",4,64,"Helio G99","5100mAh","8.7in, Android"],[9,"Watch Fit 3","Huawei",3,28,15,4.3,"p",0,0,"-","10 days","1.6in AMOLED, GPS, SpO2"],[10,"Buds Pro","Oppo",4,18,30,4.2,"fo",0,0,"-","6h+24h","ANC, Bluetooth 5.3"],[11,"65W GaN Charger","Anker",5,9,50,4.6,"p",0,0,"-","-","USB-C PD, 3 ports"],[12,"PowerCore 20000","Anker",6,24,2,4.7,"po",0,0,"-","20000mAh","22.5W, 2 USB + USB-C"],[13,"MX Keys Mini","Logitech",7,34,11,4.6,"n",0,0,"-","10 days","Wireless, backlit"],[14,"Wireless Mouse M185","Logitech",7,6,40,4.1,"p",0,0,"-","12 months","USB receiver, 2.4GHz"]].map(a=>({id:a[0],name:a[1],brand:a[2],cat:a[3],pi:a[4],stock:a[5],rating:a[6],fl:a[7],ram:a[8],sto:a[9],cpu:a[10],bat:a[11],x:a[12]}));
let P=[];
const S=k=>{try{return JSON.parse(localStorage.getItem('pta_'+k))}catch(e){return null}},W=(k,v)=>{try{localStorage.setItem('pta_'+k,JSON.stringify(v))}catch(e){}};
let cart=S('cart')||{},wish=S('wish')||[],cmp=S('cmp')||[],orders=S('orders')||[],tix=S('tix')||[],view='home',arg=null,flt={cat:'',brand:'',max:'',sort:'pop',q:''};
const $=id=>document.getElementById(id),app=$('app'),pc=p=>P.find(x=>x.id==p);
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const st=p=>p.stock==0?'<span class="out">Out of stock</span>':p.stock<=5?'<span class="low">Low stock ('+p.stock+')</span>':'<span class="in">In stock</span>';
const spec=p=>[p.ram?p.ram+'GB RAM':'',p.sto?p.sto+'GB':'',p.cpu!='-'?p.cpu:'',p.bat!='-'?p.bat:''].filter(Boolean).join(' · ')||p.x;
function card(p){return `<div class="card"><div class="img" onclick="detail(${p.id})">${p.img?`<img src="${p.img}" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:CATS[p.cat][1]}</div><b onclick="detail(${p.id})">${p.name}</b><div class="mu">${p.brand} · ${CATS[p.cat][0]}</div><div class="mu">${spec(p)}</div><div><span class="pi">${p.pi} π</span> ${p.fl.includes('o')?'<span class="tag">Offer</span>':''}</div><div class="mu">⭐${p.rating} · ${st(p)}</div><div class="row"><button class="sm" onclick="add(${p.id})" ${p.stock?'':'disabled'}>Add</button><button class="sm s" onclick="tw(${p.id})">${wish.includes(p.id)?'♥':'♡'}</button><button class="sm s" onclick="tc(${p.id})">⚖️</button></div></div>`}
const sec=(t,f)=>`<h2>${t}</h2><div class="grid">${P.filter(f).slice(0,4).map(card).join('')}</div>`;
function go(v,a){view=v;arg=a;if(v=='home')flt={cat:'',brand:'',max:'',sort:'pop',q:''},$('q').value='';render();scrollTo(0,0)}
function search(v){flt.q=v;if(view!='shop'){view='shop'}render()}
function render(){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p==view));$('cc').textContent=Object.keys(cart).length?'('+Object.values(cart).reduce((a,b)=>a+b,0)+')':'';W('cart',cart);W('wish',wish);W('cmp',cmp);app.innerHTML=V[view]?V[view]():V.page();}
const V={
home(){if(LIVE&&!P.length)return '<div class="card"><h2>Welcome to Pan Tech Africa</h2><p>Our products are coming soon.</p></div>';return `<div class="card" style="background:var(--pr);color:#fff"><h2 style="margin:0">Africa's tech, paid in Pi</h2><p>Phones, laptops and gadgets in one trusted marketplace.</p><div class="row"><button style="background:var(--ac);color:#000" onclick="go('shop')">Shop Now</button><button class="s" style="color:#fff;border-color:#fff" onclick="go('compare')">Compare Products</button></div></div>
<h2>Categories</h2><div class="cats">${CATS.map((c,i)=>`<div class="card" onclick="flt.cat=${i};go2()"><i>${c[1]}</i>${c[0]}</div>`).join('')}</div>`+sec('Featured',p=>p.fl.includes('f'))+sec('Popular',p=>p.fl.includes('p'))+sec('New Arrivals',p=>p.fl.includes('n'))+sec('Special Offers',p=>p.fl.includes('o'))+sec('Recommended for you',p=>wish.length?(wish.map(w=>pc(w).cat).includes(p.cat)):p.rating>=4.5)+
`<h2>Why Pan Tech Africa</h2><div class="card">✔ Technology in one place<br>✔ Pi-based payments<br>✔ Easy product comparison<br>✔ Simple shopping & order tracking<br>✔ Customer support<br>✔ Secure checkout<div class="mu" style="margin-top:6px">Pan Tech Africa is an independent marketplace and is not endorsed by or affiliated with Pi Network.</div></div>
<footer><b>Pan Tech Africa</b><br>${['about','contact','support','faq','privacy','terms','refund','delivery'].map(p=>`<a onclick="go('page','${p}')">${p}</a>`).join(' ')}<br>© Pan Tech Africa</footer>`},
shop(){let l=P.filter(p=>(flt.cat===''||p.cat==flt.cat)&&(!flt.brand||p.brand==flt.brand)&&(!flt.max||p.pi<=+flt.max)&&(!flt.q||(p.name+p.brand+CATS[p.cat][0]).toLowerCase().includes(flt.q.toLowerCase())));
const s={lo:(a,b)=>a.pi-b.pi,hi:(a,b)=>b.pi-a.pi,new:(a,b)=>b.id-a.id,pop:(a,b)=>b.rating-a.rating,rate:(a,b)=>b.rating-a.rating}[flt.sort];l.sort(s);
return `<div class="card"><select onchange="flt.cat=this.value;render()"><option value="">All categories</option>${CATS.map((c,i)=>`<option value="${i}" ${flt.cat==i&&flt.cat!==''?'selected':''}>${c[0]}</option>`).join('')}</select><select onchange="flt.brand=this.value;render()"><option value="">All brands</option>${[...new Set(P.map(p=>p.brand))].sort().map(b=>`<option ${flt.brand==b?'selected':''}>${b}</option>`).join('')}</select><input class="f" type="number" placeholder="Max price (π)" value="${flt.max}" onchange="flt.max=this.value;render()"><select onchange="flt.sort=this.value;render()">${[['pop','Popular'],['lo','Price: Low to High'],['hi','Price: High to Low'],['new','Newest'],['rate','Highest Rated']].map(o=>`<option value="${o[0]}" ${flt.sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><button class="s sm" onclick="flt={cat:'',brand:'',max:'',sort:'pop',q:''};$('q').value='';render()">Clear Filters</button></div><h2>${l.length} result${l.length==1?'':'s'}</h2>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="mu">No products match. Try clearing filters.</p>'}`},
compare(){if(!cmp.length)return `<h2>Compare</h2><p>No products selected. Tap ⚖️ on any product (up to 3).</p><button onclick="go('shop')">Browse Products</button>`;const L=cmp.map(pc);const rows=[['Price (π)',p=>p.pi],['Brand',p=>p.brand],['RAM',p=>p.ram?p.ram+'GB':'-'],['Storage',p=>p.sto?p.sto+'GB':'-'],['Processor',p=>p.cpu],['Battery',p=>p.bat],['Details',p=>p.x],['Rating',p=>p.rating],['Availability',p=>p.stock?'In stock':'Out of stock']];
return `<h2>Compare</h2><div class="scroll"><table><tr><th></th>${L.map(p=>`<th>${CATS[p.cat][1]} ${p.name}<br><button class="sm s" onclick="tc(${p.id})">Remove</button></th>`).join('')}</tr>${rows.map(r=>{const v=L.map(p=>r[1](p));const d=new Set(v).size>1;return `<tr><td><b>${r[0]}</b></td>${v.map(x=>`<td class="${d?'diff':''}">${x}</td>`).join('')}</tr>`}).join('')}</table></div><div class="row"><button class="s" onclick="cmp=[];render()">Clear Comparison</button></div><p class="mu">Highlighted rows show differences.</p>`},
cart(){const ids=Object.keys(cart);if(!ids.length)return `<h2>Cart</h2><p>Your cart is empty.</p><button onclick="go('shop')">Start Shopping</button>`;let t=0;return `<h2>Cart</h2>`+ids.map(i=>{const p=pc(i),q=cart[i];t+=p.pi*q;return `<div class="card" style="margin-bottom:8px"><b>${p.name}</b> <span class="mu">${p.pi} π each</span><div class="row"><button class="sm s" onclick="qty(${i},-1)">−</button><b style="padding:8px">${q}</b><button class="sm s" onclick="qty(${i},1)">+</button><span class="pi" style="margin-left:auto">${p.pi*q} π</span><button class="sm s" onclick="delete cart[${i}];render()">Remove</button></div></div>`}).join('')+`<h2>Total: <span class="pi">${t} Pi</span></h2><div class="row"><button class="s" onclick="go('shop')">Continue Shopping</button><button onclick="go('checkout')">Proceed to Checkout</button></div>`},
checkout(){if(!Object.keys(cart).length)return V.cart();if(!COUNTRIES.length)setTimeout(loadCountries,0);shipFee=0;const t=tot();return `<h2>Checkout</h2><div class="card">${Object.keys(cart).map(i=>`${pc(i).name} × ${cart[i]} = ${pc(i).pi*cart[i]} π<br>`).join('')}<b>Total Amount: <span class="pi" id="tt">${couponPct?Math.round(t*(100-couponPct)*1e5)/1e7:t} Pi</span></b></div><div class="row"><input class="f" id="cpn" placeholder="Discount code (optional)" style="flex:1"><button class="sm s" onclick="applyCoupon()">Apply</button></div><h2>Delivery information</h2><select class="f" id="co" onchange="quoteShip()"><option value="">Country</option>${COUNTRIES.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div class="mu" id="shipline">${COUNTRIES.length?'Delivery: choose your country':'Delivery is not available yet.'}</div><input class="f" id="n" placeholder="Full name"><input class="f" id="ph" type="tel" placeholder="Phone number"><input class="f" id="ad" placeholder="Delivery address"><input class="f" id="ci" placeholder="City"><input class="f" id="stt" placeholder="State"><textarea id="ins" placeholder="Delivery instructions (optional)"></textarea><div class="note"><b>Payment safety:</b> never share your Pi passphrase. Pan Tech Africa never asks for it.</div><button style="width:100%" onclick="pay()">Pay with Pi</button>${PAYOPEN?'':'<div class="mu" style="text-align:center;margin-top:6px">Payments will open soon.</div>'}`},
orders(){setTimeout(syncOrders,0);if(!orders.length)return `<h2>Orders</h2><p>You haven't placed any orders yet.</p><button onclick="go('shop')">Start Shopping</button>`;return `<h2>Orders</h2>`+orders.map(o=>`<div class="card" style="margin-bottom:8px"><b>${o.id}</b> · ${o.date}<div class="mu">${o.items}</div><b class="pi">${o.total} π</b><div class="mu">Payment: ${o.pay} · Delivery: ${o.status}</div>${o.courier||o.tracking?`<div class="mu">Courier: ${esc(o.courier||'-')} · Tracking: ${esc(o.tracking||'-')}</div>`:''}<button class="sm s" onclick="go('track','${o.id}')">Track order</button> <button class="sm s" onclick="ret('${o.id}')">Request return</button></div>`).join('')+`<div class="row"><button class="s" onclick="go('returns')">My return requests</button></div>`},
track(){const o=orders.find(x=>x.id==arg),S=["Order Placed","Payment Confirmed","Processing","Shipped","Out for Delivery","Delivered"];const c=S.indexOf(o.status);return `<h2>${o.id}</h2><p class="mu">Payment status: <b>${o.pay}</b> (separate from delivery)</p>${o.courier||o.tracking?`<p class="mu">Courier: ${esc(o.courier||'-')} · Tracking number: <b>${esc(o.tracking||'-')}</b></p>`:''}`+S.map((s,i)=>`<div class="step ${i<=c?'done':''}">${i<=c?'✅':'⚪'} ${s}${i==c?' <b>(current)</b>':''}</div>`).join('')+`<p class="mu">Payment confirmation and later steps are updated by admin/back end after server verification.</p>`},
profile(){return `<h2 onclick="adminTap()">Profile</h2><div class="card"><div class="row"><button class="s" onclick="go('wishlist')">♡ Wishlist (${wish.length})</button><button class="s" onclick="go('orders')">📦 Orders (${orders.length})</button><button class="s" onclick="go('support')">💬 Support</button><button class="s" onclick="go('page','faq')">FAQ</button></div><button onclick="ensureAuth().then(ok=>toast(ok?'Signed in with Pi':'Please open in Pi Browser'))">Sign in with Pi</button></div>`},
returns(){setTimeout(loadReturns,0);return '<h2>My returns</h2><div id="rl">Loading...</div>'},
notifications(){setTimeout(loadNotes,0);return '<h2>Notifications</h2><div id="nl">Loading...</div>'},
wishlist(){return `<h2>Wishlist</h2>`+(wish.length?`<div class="grid">${wish.map(pc).map(card).join('')}</div>`:`<p>You haven't saved any products yet.</p>`)},
support(){setTimeout(loadTickets,0);return `<h2>Support</h2><div class="card"><select id="ts"><option>Orders</option><option>Payments</option><option>Delivery</option><option>Products</option><option>Returns</option><option>Refunds</option><option>Account</option></select><textarea id="tm" placeholder="Describe your issue"></textarea><button onclick="ticket()">Send message to support</button></div><h2>My messages</h2><div id="tl">Loading...</div>`},
page(){const T={about:"Pan Tech Africa is an independent African technology marketplace built for the Pi ecosystem. It is not owned by or endorsed by Pi Network.",contact:"Email: pantechafrica.support@gmail.com",faq:"Pi Payment: pay at checkout; we never ask for your passphrase. Orders: track under Profile → Orders. Delivery: statuses update as your item ships. Returns: request from the order page. Security: only approve payments inside Pi Browser.",support:"Open a ticket from the Support page.",privacy:"Read our full <a href='privacy.html'>Privacy Policy</a>. We never ask for your Pi passphrase.",terms:"Read our full <a href='terms.html'>Terms of Service</a>.",refund:"Returns are accepted within 15 days of delivery for wrong, damaged or defective items. Request one from your order page. Refunds are made in Pi.",delivery:"Delivery details are collected at checkout. Track your order under Orders."};return `<h2 style="text-transform:capitalize">${arg}</h2><div class="card">${T[arg]}</div>`}};
let _t=0;function adminTap(){if(++_t>=7){_t=0;location.href='admin.html'}}
function go2(){view='shop';$('q').value='';flt.q='';render();scrollTo(0,0)}
const tot=()=>Object.keys(cart).reduce((a,i)=>a+pc(i).pi*cart[i],0);
function add(id){const p=pc(id);if(!p.stock)return toast('This product is currently out of stock.');if((cart[id]||0)>=p.stock)return toast('Maximum available stock reached');cart[id]=(cart[id]||0)+1;toast('Added to cart');render()}
function qty(i,d){const n=(cart[i]||0)+d;if(n<=0)delete cart[i];else if(n<=pc(i).stock)cart[i]=n;render()}
function tw(id){wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];render()}
function tc(id){if(cmp.includes(id))cmp=cmp.filter(x=>x!=id);else if(cmp.length>=3)return toast('Compare up to 3 products');else{cmp.push(id);toast('Added to compare')}render()}
function detail(id){const p=pc(id),m=document.createElement('div');m.className='modal';m.onclick=e=>{if(e.target==m)m.remove()};const rel=P.filter(x=>x.cat==p.cat&&x.id!=id).slice(0,3);m.innerHTML=`<div>${p.imgs&&p.imgs.length?`<div style="display:flex;gap:6px;overflow-x:auto">${p.imgs.map(u=>`<img src="${u}" loading="lazy" style="height:180px;border-radius:10px">`).join('')}</div>`:`<div class="img" style="height:150px;font-size:80px">${CATS[p.cat][1]}</div>`}<h2>${p.name}</h2><div class="mu">${p.brand} · ${CATS[p.cat][0]}</div><div class="pi" style="font-size:22px">${p.pi} π</div><p>${st(p)} · ⭐${p.rating}</p><p>${p.x}</p><div class="scroll"><table>${[['RAM',p.ram?p.ram+'GB':'-'],['Storage',p.sto?p.sto+'GB':'-'],['Processor',p.cpu],['Battery',p.bat],['Warranty','12 months']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div><div class="row"><button onclick="add(${id});this.closest('.modal').remove()" ${p.stock?'':'disabled'}>Buy Now / Add to Cart</button><button class="s" onclick="tw(${id});this.closest('.modal').remove()">Wishlist</button><button class="s" onclick="tc(${id});this.closest('.modal').remove()">Compare</button><button class="s" onclick="this.closest('.modal').remove();go('support')">Chat with Support</button></div><h2>Reviews</h2><div id="rv">Loading reviews...</div><div class="card"><b>Write a review</b><div class="mu">Only customers who bought this product can review it.</div><select class="f" id="rvr"><option value="5">★★★★★ (5)</option><option value="4">★★★★ (4)</option><option value="3">★★★ (3)</option><option value="2">★★ (2)</option><option value="1">★ (1)</option></select><textarea id="rvt" placeholder="Your review"></textarea><button class="sm" onclick="sendReview(${id})">Submit review</button></div><b>Related</b><div class="grid">${rel.map(card).join('')}</div></div>`;document.body.appendChild(m);setTimeout(()=>loadReviews(id),0)}

orders.unshift(o);W('orders',orders);cart={};view='done';arg=o.id;app.innerHTML=`<h2>Order Placed</h2><div class="card"><b>${o.id}</b><br>${o.items}<br>Total: <b class="pi">${o.total} π</b><br>Payment status: <b>Pending</b><div class="note">Demo mode: Pi payment can't run here (the Pi SDK host is blocked on published pages). The order stays <b>Pending</b> and is never marked paid from the frontend. Server-side verification is required for production.</div></div><div class="row"><button onclick="go('track','${o.id}')">View order</button><button class="s" onclick="go('shop')">Keep shopping</button></div>`;render2()}

async function ensureAuth(){if(H)return true;try{const a=await Pi.authenticate(['username','payments'],inc);H={'Content-Type':'application/json',Authorization:'Bearer '+a.accessToken};return true}catch(e){return false}}
let couponPct=0,couponCode='',notes=[];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadCountries(){try{const r=await fetch(API+'/api/countries'),c=await r.json();if(Array.isArray(c)&&c.length){COUNTRIES=c.map(x=>x.name);const s=$('co');if(s){s.innerHTML='<option value="">Country</option>'+COUNTRIES.map(n=>'<option>'+esc(n)+'</option>').join('');const l=$('shipline');if(l)l.textContent='Delivery: choose your country'}}}catch(e){}}
async function loadReviews(id){const el=$('rv');if(!el)return;try{const r=await fetch(API+'/api/products/'+id+'/reviews'),d=await jr(r);const st=n=>'★'.repeat(n)+'☆'.repeat(5-n);el.innerHTML=d.count?'<div><b>'+d.avg+' / 5</b> <span class="mu">('+d.count+' review'+(d.count==1?'':'s')+')</span></div>'+d.reviews.map(x=>'<div class="card" style="margin:6px 0">'+st(x.rating)+' <b>'+esc(x.by)+'</b><div>'+esc(x.review)+'</div><div class="mu">'+new Date(x.created).toLocaleDateString()+'</div></div>').join(''):'<p class="mu">No reviews yet.</p>'}catch(e){el.textContent='Reviews are not available right now.'}}
async function sendReview(id){const t=($('rvt').value||'').trim();if(t.length<3)return toast('Please write a short review');if(!LIVE||!await ensureAuth())return toast('Please open Pan Tech Africa in Pi Browser to review.');try{const r=await post('/api/reviews',{productId:id,rating:+$('rvr').value,review:t}),d=await jr(r);if(!r.ok)throw new Error(d.error||'failed');$('rvt').value='';toast('Thank you for your review');loadReviews(id)}catch(e){toast(e.message&&e.message.length<80?e.message:'Could not send the review')}}
const prodTotal=()=>Math.round(tot()*(100-couponPct)*1e5)/1e7;
const grand=()=>Math.round((prodTotal()+shipFee)*1e7)/1e7;
function showTotal(){const e=$('tt');if(e)e.textContent=grand()+' Pi'}
async function quoteShip(){const c=$('co').value;shipFee=0;if(!c){$('shipline').textContent='Delivery: choose your country';return showTotal()}try{const r=await fetch(API+'/api/shipping/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({country:c,items:Object.keys(cart).map(i=>({id:+i,qty:cart[i]}))})}),d=await jr(r);if(!r.ok)throw new Error(d.error);shipFee=d.fee;$('shipline').textContent='Delivery to '+c+': '+d.fee+' Pi'}catch(e){shipFee=0;$('shipline').textContent='We do not deliver to this country yet.'}showTotal()}
async function applyCoupon(){const c=($('cpn').value||'').trim().toUpperCase();if(!c){couponPct=0;couponCode='';showTotal();return}try{const r=await fetch(API+'/api/coupon/check?code='+encodeURIComponent(c)),d=await jr(r);if(!r.ok)throw new Error(d.error);couponPct=d.percent;couponCode=c;showTotal();toast(couponPct+'% discount applied')}catch(e){couponPct=0;couponCode='';showTotal();toast('This discount code is not valid.')}}
async function fetchNotes(){if(!LIVE||!await ensureAuth())return false;try{const r=await fetch(API+'/api/my/notifications',{headers:H});if(!r.ok)return false;notes=await r.json();const seen=+(S('seen')||0),n=notes.filter(x=>x.created>seen).length,b=$('nb');if(b){b.textContent=n;b.style.display=n?'inline':'none'}return true}catch(e){return false}}
async function loadNotes(){const ok=await fetchNotes(),el=$('nl');if(!el)return;el.innerHTML=!ok?'<p>Sign in with Pi to see notifications.</p>':notes.length?notes.map(x=>`<div class="card" style="margin-bottom:8px"><b>${esc(x.title)}</b><div>${esc(x.body)}</div><div class="mu">${new Date(x.created).toLocaleString()}</div></div>`).join(''):'<p>No notifications yet.</p>';if(ok){W('seen',Date.now());const b=$('nb');if(b)b.style.display='none'}}
let synced=false;
async function syncOrders(){if(!LIVE||synced)return;synced=true;if(!await ensureAuth())return;try{const r=await fetch(API+'/api/my/orders',{headers:H});if(!r.ok)return;const L=await r.json();orders=L.map(o=>({id:o.id,date:new Date(o.created).toLocaleDateString(),items:JSON.parse(o.items).map(l=>l.name+' x'+l.qty).join(', '),total:o.totalPi,pay:o.paymentStatus,status:o.orderStatus,courier:o.courier,tracking:o.tracking}));W('orders',orders);render()}catch(e){}}
async function ret(id){if(!LIVE||!await ensureAuth())return toast('Please sign in with Pi');const r=prompt('Why do you want to return this order?');if(!r)return;const x=await post('/api/returns',{orderId:id,reason:r}),d=await x.json();toast(x.ok?'Return requested ('+d.id+')':d.error||'Could not request return')}
async function loadReturns(){if(!await ensureAuth())return;try{const r=await fetch(API+'/api/my/returns',{headers:H}),L=await r.json();$('rl').innerHTML=L.length?L.map(x=>`<div class="card" style="margin-bottom:8px"><b>${x.id}</b> · order ${x.orderId}<br>Status: <b>${x.status}</b><div class="mu">${x.note||''}</div></div>`).join(''):'<p>You have no return requests.</p>'}catch(e){$('rl').textContent='Unable to load returns.'}}
async function ticket(){const m=$('tm').value.trim();if(!m)return toast('Please enter a message');if(!LIVE||!await ensureAuth())return toast('Please open Pan Tech Africa in Pi Browser to contact support.');try{const r=await post('/api/tickets',{subject:$('ts').value,message:m}),d=await jr(r);if(!r.ok)throw new Error(d.error||'failed');$('tm').value='';toast('Message sent. Ticket '+d.id);loadTickets()}catch(e){toast('Could not send. Please try again.')}}
async function loadTickets(){const el=$('tl');if(!el)return;if(!LIVE||!await ensureAuth()){el.textContent='Sign in with Pi to see your messages.';return}try{const r=await fetch(API+'/api/my/tickets',{headers:H}),L=await jr(r);el.innerHTML=Array.isArray(L)&&L.length?L.map(t=>`<div class="card" style="margin-bottom:8px"><b>${esc(t.id)}</b> · ${esc(t.subject)} · ${esc(t.status)}<br>${esc(t.message)}${JSON.parse(t.replies||'[]').map(x=>`<div class="mu">↳ Support: ${esc(x.text)}</div>`).join('')}<div class="mu">${new Date(t.created).toLocaleString()}</div></div>`).join(''):'<p>No messages yet.</p>'}catch(e){el.textContent='Unable to load messages.'}}
window.addEventListener('error',e=>toast('Page error: '+String(e.message).slice(0,80)));

const API="https://pantech-live.onrender.com";
try{Pi.init({version:"2.0",sandbox:false})}catch(e){}
const jr=async r=>{const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('Server answered '+r.status+': '+t.replace(/<[^>]*>/g,' ').trim().slice(0,100))}};
const post=(p,b)=>fetch(API+p,{method:'POST',headers:H,body:JSON.stringify(b)});
const inc=async pay=>{try{if(pay.transaction&&H)await post('/api/pi/complete',{paymentId:pay.identifier,txid:pay.transaction.txid})}catch(e){}};
async function pay(){if(!PAYOPEN)return toast('Payments are not open yet. Please check back soon.');const v=i=>$(i).value.trim();if(!$('co').value||!v('n')||!v('ph')||!v('ad')||!v('ci')||!v('stt'))return toast('Please complete delivery information');
if(!LIVE||!window.Pi)return toast('Please open Pan Tech Africa in Pi Browser to pay.');
try{toast('Opening Pi...');const a=await Pi.authenticate(['username','payments'],inc);H={'Content-Type':'application/json',Authorization:'Bearer '+a.accessToken};
const items=Object.keys(cart).map(i=>({id:+i,qty:cart[i]})),sum=Object.keys(cart).map(i=>pc(i).name+' x'+cart[i]).join(', ');
const r=await post('/api/orders',{items,coupon:couponCode,delivery:{country:$('co').value,name:v('n'),phone:v('ph'),address:v('ad'),city:v('ci'),state:v('stt'),notes:v('ins')}}),od=await jr(r);if(!r.ok)return toast(od.error||'Order failed');
const o={id:od.orderId,date:new Date().toLocaleDateString(),items:sum,total:od.totalPi,pay:'Pending',status:'Order Placed'};orders.unshift(o);W('orders',orders);
const setPay=(s,st)=>{o.pay=s;if(st)o.status=st;W('orders',orders)};
Pi.createPayment({amount:od.totalPi,memo:'Pan Tech Africa '+od.orderId,metadata:{orderId:od.orderId}},{
onReadyForServerApproval:async id=>{setPay('Processing');try{const a=await post('/api/pi/approve',{paymentId:id});if(!a.ok){const d=await a.json().catch(()=>({}));toast('Payment could not be completed. Please try again.')}}catch(e){toast('Unable to connect. Please check your internet connection and try again.')}},
onReadyForServerCompletion:async(id,tx)=>{const c=await post('/api/pi/complete',{paymentId:id,txid:tx});if(c.ok){setPay('Completed','Payment Confirmed');couponPct=0;couponCode='';cart={};W('cart',cart);view='done';app.innerHTML=`<h2>Payment Successful</h2><div class="card"><b>Order Confirmed</b><br>${o.id}<br>${o.items}<br>Total: <b class="pi">${o.total} π</b><br>Payment status: <b>Completed</b></div><div class="row"><button onclick="go('track','${o.id}')">View order</button><button class="s" onclick="go('shop')">Keep shopping</button></div>`;render2()}else{const d=await c.json().catch(()=>({}));toast('Payment could not be completed. Please try again.')}},
onCancel:id=>{setPay('Cancelled');post('/api/pi/cancel',{paymentId:id,orderId:o.id});toast('Payment cancelled')},
onError:e=>{setPay('Failed');toast('Payment could not be completed. Please try again.')}})}
catch(e){toast(/Server answered|Failed to fetch|NetworkError/.test(String(e&&e.message))?'Unable to connect. Please check your internet connection and try again.':'Payment could not be completed. Please try again.')}}
fetch(API+'/api/countries').then(r=>r.json()).then(c=>{if(Array.isArray(c))COUNTRIES=c.map(x=>x.name)}).catch(()=>{});
fetch(API+'/api/config').then(r=>r.json()).then(c=>{PAYOPEN=!!c.paymentsOpen;const wa=String(c.whatsapp||'').replace(/\D/g,'');if(wa){const a=document.createElement('a');a.className='wa';a.href='https://wa.me/'+wa+'?text='+encodeURIComponent('Hello Pan Tech Africa, I need help.');a.target='_blank';a.rel='noopener';a.textContent='💬 WhatsApp';document.body.appendChild(a)}render()}).catch(()=>{});
fetch(API+'/api/products?limit=50&_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(L=>{if(!Array.isArray(L))return;P=L.map(p=>{let s={};try{s=JSON.parse(p.specs)}catch(e){}return{imgs:Array.from({length:p.imgCount||0},(_,i)=>API+'/api/products/'+p.id+'/image/'+i),img:p.hasImage?API+'/api/products/'+p.id+'/image':'',id:p.id,name:p.name,brand:p.brand,cat:Math.max(0,CATS.findIndex(c=>c[0]==p.category)),pi:p.pricePi,stock:p.stock,rating:s.rating||4,fl:(p.featured?'f':'')+(p.popular?'p':'')+(p.isNew?'n':'')+(s.offer?'o':''),ram:s.ram||0,sto:s.sto||0,cpu:s.cpu||'-',bat:s.bat||'-',x:s.x||''}});LIVE=true;Object.keys(cart).forEach(k=>{if(!pc(k))delete cart[k]});cmp=cmp.filter(x=>pc(x));wish=wish.filter(w=>pc(w));render();if(H)setTimeout(fetchNotes,1000)}).catch(()=>{});
